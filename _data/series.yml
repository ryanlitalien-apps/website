# Multi-part series. A post joins one by setting `series: <key>` and
# `series_part: <n>` in its front matter; _includes/series.html renders the
# "Part n of N" line and the parts list, linking parts that are published and
# listing the rest as upcoming. Titles here are working titles for unpublished
# parts; a published post's own title wins.
#
# Building Aida is the broad-audience series (four parts plus a fifth in progress) decided in aida's
# docs/plan-open-source.md (Phase 4): readable start to finish with no code
# blocks, technical depth in sidebars that link into the repo's docs/.
aida:
  title: "Building Aida"
  parts:
    - "Aida, Part 1: An agent of agents for one person"
    - "Aida, Part 2: How it decides"
    - "Aida, Part 3: How it remembers"
    - "Aida, Part 4: What it spawned"
    - "Aida, Part 5: Dynamic model selection (work in progress)"
