# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: ryanlitalien.com
author: "Ryan L'Italien"
#email: your-email@example.com
# `logo:` intentionally removed: it pointed jekyll-seo-tag's structured data
# at trail-running-medium-narrow.png, a stock photo of someone who is not
# Ryan. That image is still used by the old header.html hero banner (left
# alone here, Phase 1 deletes it per rebrand plan s.12), but it should not
# also be asserted as the site's Organization logo in public JSON-LD.
description: >- # this means to ignore newlines until "baseurl:"
  Fractional CTO for companies whose growth runs through partners, integrations, and AI.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://www.ryanlitalien.com" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: ryanlitalien
twitter:
  username: ryanlitalien
  card: summary_large_image
github_username:  ryanlitalien
github: [metadata]

# Build settings
#markdown: CommonMarkGhPages
#commonmark:
#  options: ["SMART", "FOOTNOTES"]
#  extensions: ["strikethrough", "autolink", "table", "tagfilter"]

theme: jekyll-theme-minimal
plugins:
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-feed

# Exclude from processing.
# NOTE: setting `exclude` REPLACES Jekyll's defaults rather than extending
# them, so the default entries below must stay listed or they start being
# published. CLAUDE.md, README.md, docs, .idea, and .claude are repo/tooling
# exhaust that was otherwise being served publicly (rebrand plan s.12).
exclude:
  - CLAUDE.md
  - README.md
  - docs
  - .idea
  - .claude
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Default front matter: every page gets the social card unless it sets its
# own `image`. jekyll-seo-tag ({% seo %} in _includes/head.html) reads
# page.image to emit og:image and twitter:image.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/social-card.png
