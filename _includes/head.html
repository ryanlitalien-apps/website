{% seo %}

<!--
  Theme init: inline and blocking (no `defer`/`async`) so it runs before
  the stylesheet paints -- this is the "no flash on load" requirement. It
  only ever sets data-theme when the visitor already made an explicit
  light/dark choice on a previous visit; "system" (no stored value) leaves
  the attribute off entirely and site.css's prefers-color-scheme query
  takes over. Kept tiny and dependency-free on purpose.
-->
<script>
  (function () {
    try {
      var stored = localStorage.getItem("theme");
      if (stored === "light" || stored === "dark") {
        document.documentElement.setAttribute("data-theme", stored);
      }
    } catch (e) {}
  })();
</script>
