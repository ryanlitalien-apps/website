<!--
  Named site-footer.html (not footer.html) on purpose: _includes/footer.html
  already exists and is shared by the old Bootstrap/mediumish layout that
  every other page on the site still uses. Overwriting it would restyle
  those pages before Phase 1 gets to them, which the build brief says not
  to do. This file is included only by _layouts/base.html.

  /accessibility/ and /privacy/ do not exist yet as real pages at those
  URLs (Phase 1, rebrand plan s.12/13) -- privacy.md currently only
  publishes at /simple/privacy/. Their links are commented out below
  instead of left as dead links. Restore once those pages exist at these
  paths.

  Booking: site.data.contact.booking carries the live Cal.com link; the
  conditional stays so the entry drops out cleanly if the link is ever
  emptied.
-->
<footer class="pitch-footer">
  <p>
    Ryan L&rsquo;Italien
  </p>
  <ul class="footer-links">
    <li><a href="mailto:{{ site.data.contact.email }}">{{ site.data.contact.email }}</a></li>
    <li><a href="{{ site.data.contact.linkedin }}">LinkedIn</a></li>
    <li><a href="{{ site.data.contact.github }}">GitHub</a></li>
    {% if site.data.contact.booking != empty %}
    <li><a href="{{ site.data.contact.booking }}">Book a call</a></li>
    {% endif %}
    {% comment %}
    Phase 1: restore when page exists.
    <li><a href="/accessibility/">Accessibility</a></li>
    <li><a href="/privacy/">Privacy</a></li>
    {% endcomment %}
  </ul>
</footer>
