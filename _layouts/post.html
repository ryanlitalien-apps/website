---
layout: base
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</p>
    {% if page.image %}<img class="post-hero" src="{{ page.image }}" alt="">{% endif %}
  </header>
  <div class="post-content">
{{ content }}
  </div>
  <footer class="post-footer">
    <a href="/posts/">&larr; All posts</a>
  </footer>
</article>
